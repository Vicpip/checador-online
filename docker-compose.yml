services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fieldcheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fieldcheck}
      POSTGRES_DB: ${POSTGRES_DB:-fieldcheck}
      TZ: ${TZ:-America/Mexico_City}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fieldcheck}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://fieldcheck:fieldcheck@postgres:5432/fieldcheck}
      TZ: ${TZ:-America/Mexico_City}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - fotos_data:/var/fieldcheck/fotos
      - logo_data:/var/fieldcheck/logo
    expose:
      - "8000"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: on-failure
    depends_on:
      - backend
    ports:
      - "8082:80"
      - "8083:81"

volumes:
  postgres_data:
  fotos_data:
  logo_data:
