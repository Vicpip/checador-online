# field-check reverse proxy + static hosting.
# Admin dashboard and worker PWA are served on separate ports so they are
# completely separate origins — this keeps their service workers isolated
# from each other (a shared origin let either SW intercept the other app's
# navigations).
#   :80 (host 8080) -> admin dashboard
#       /            -> admin dashboard (React SPA)
#       /admin/      -> admin dashboard (React SPA, same app as /)
#       /api/        -> FastAPI backend (prefix stripped before proxying)
#   :81 (host 8081) -> worker PWA
#       /            -> worker PWA (mobile-first, check-in/check-out)
#       /api/        -> FastAPI backend (prefix stripped before proxying)

server {
    listen 80;
    server_name _;
    client_max_body_size 15M;

    # ── API ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Admin dashboard SPA ────────────────────────────────────────────
    # Served under /admin/ AND at the site root — same build, same files,
    # reached via two prefixes. Its asset URLs are absolute (/admin/assets/...,
    # vite `base: "/admin/"`) so they resolve the same regardless of which
    # prefix loaded the page.
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }
}

server {
    listen 81;
    server_name _;
    client_max_body_size 15M;

    # ── API ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Worker PWA ─────────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html/pwa;
        try_files $uri $uri/ /index.html;
    }

    # PWA service worker must not be cached aggressively
    location = /sw.js {
        root /usr/share/nginx/html/pwa;
        add_header Cache-Control "no-cache";
    }
}
